name: zipbi_customer
description: "ZipBi Customer App - AI-Assisted Café Discovery and Ordering Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  http: ^1.3.0
  intl: ^0.19.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo/
    - assets/images/cafes/
    - assets/data/
